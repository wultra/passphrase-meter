name: tests

on:
  push:
    branches:
      - develop
      - master
      - releases/*
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: macos-14
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v3

      # Android setup and test runner is temporarily disabled.
